<html lang="en">
<head>

<style>
  :root{
    --navy:#1F3A5F; --navy-deep:#16293f; --teal:#2E7D8A; --steel:#4A6B8A;
    --bg:#F7F5F1; --card:#ffffff; --ink:#232a31; --muted:#6b7783;
    --line:#e4e0d8; --amber:#BF8F00; --amber-bg:#FBF3E0;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--teal);text-decoration:none}

  /* Header */
  header{background:var(--navy);color:#fff;padding:18px 22px;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  .hwrap{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.2px;white-space:nowrap}
  .brand .dot{color:var(--teal)}
  .brand .ver{font-family:var(--sans);font-size:11px;font-weight:600;color:#9fb4cc;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
  .tag{font-size:12px;color:#b9c6d6;border-left:1px solid #3a5675;padding-left:14px;margin-left:2px}
  .searchbox{flex:1;min-width:220px;position:relative}
  .searchbox input{width:100%;padding:11px 14px 11px 40px;border:none;border-radius:9px;font-size:15px;font-family:var(--sans);background:#fff;color:var(--ink)}
  .searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}

  /* Layout */
  .layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:0;min-height:calc(100vh - 62px)}
  nav{border-right:1px solid var(--line);padding:22px 14px 60px;position:sticky;top:62px;align-self:start;max-height:calc(100vh - 62px);overflow-y:auto}
  .nav-group{margin-bottom:20px}
  .nav-group h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 8px 8px;font-weight:700}
  .nav-item{display:flex;gap:9px;align-items:baseline;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14.5px;color:var(--ink);transition:background .12s}
  .nav-item:hover{background:#efece5}
  .nav-item.active{background:var(--navy);color:#fff}
  .nav-item.active .nav-code{color:#9fd0d9}
  .nav-item.calc-item{background:linear-gradient(135deg,#2E7D8A,#245e69);color:#fff;font-weight:600;margin:4px 4px 8px;border-radius:9px;box-shadow:0 2px 6px rgba(46,125,138,.25)}
  .nav-item.calc-item .nav-code{color:#cdeef2}
  .nav-item.calc-item:hover{background:linear-gradient(135deg,#34909f,#296b77)}
  .nav-item.calc-item.active{background:linear-gradient(135deg,#245e69,#1c4a53)}
  .nav-code{font-size:11.5px;font-weight:700;color:var(--teal);min-width:30px}

  main{padding:34px 40px 90px;max-width:900px}

  /* Home / hero */
  .hero{margin-bottom:30px}
  .hero .kicker{font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:10px}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.12;color:var(--navy);margin-bottom:14px}
  .hero p{font-size:16px;color:var(--muted);max-width:640px}
  .stats{display:flex;gap:26px;margin:26px 0 8px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 22px;min-width:120px}
  .stat .n{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600}
  .stat .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:24px}
  .lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
  .lcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,58,95,.10);border-color:var(--teal)}
  .lcard .code{font-size:11.5px;font-weight:700;color:var(--teal);letter-spacing:.5px}
  .lcard .t{font-family:var(--serif);font-size:17px;color:var(--navy);margin-top:4px;line-height:1.25}

  /* Article */
  article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:38px 44px}
  article h1{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--navy);line-height:1.15;margin-bottom:6px}
  article h1 + .sub{color:var(--muted);font-size:15px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  article h1.doc{font-size:28px}
  .doc-h1{font-family:var(--serif);font-weight:600;font-size:25px;color:var(--navy);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--teal)}
  .doc-h2{font-family:var(--sans);font-weight:700;font-size:19px;color:var(--navy-deep);margin:24px 0 8px}
  .doc-h3{font-weight:700;font-size:16px;color:var(--steel);margin:18px 0 6px}
  article p{margin:11px 0;font-size:15.5px}
  article ul,article ol{margin:11px 0 11px 24px}
  article li{margin:5px 0;font-size:15.5px}
  article strong{color:var(--navy-deep)}
  article em{color:#3f4a55}
  .callout{background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:15px}
  .callout.collapsible .cb-teaser{font-size:15px}
  .cb-full{margin-top:12px;font-size:15px;line-height:1.6;border-top:1px solid #e8d9a8;padding-top:12px}
  .cb-toggle{margin-top:10px;background:var(--navy);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer}
  .cb-toggle:hover{background:var(--navy-deep)}

  /* Dose calculator */
  .calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 34px;max-width:640px}
  .calc h1{font-family:var(--serif);font-weight:600;font-size:28px;color:var(--navy);margin-bottom:6px}
  .calc .csub{color:var(--muted);font-size:15px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .calc-field{margin-bottom:18px}
  .calc-field label{display:block;font-size:14px;font-weight:600;color:var(--navy-deep);margin-bottom:6px}
  .calc-field .hint{font-weight:400;color:var(--muted);font-size:12.5px}
  .calc-field input,.calc-field select{width:100%;padding:11px 13px;border:1px solid #cdd5dd;border-radius:9px;font-size:16px;font-family:var(--sans);background:#fff}
  .calc-field input:focus,.calc-field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,125,138,.12)}
  .calc-result{margin-top:22px;background:#EAF1F8;border:1px solid #cdddf0;border-radius:12px;padding:22px 24px;text-align:center}
  .calc-result .big{font-family:var(--serif);font-size:42px;font-weight:600;color:var(--navy);line-height:1.1}
  .calc-result .big small{font-size:20px;color:var(--teal);font-weight:600}
  .calc-result .detail{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.6}
  .calc-result.warn{background:var(--amber-bg);border-color:#e8d9a8}
  .calc-result.warn .big{color:var(--amber)}
  .calc-note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.55}

  /* Lock / gate */
  .locked{background:var(--card);border:1px dashed #c9b98a;border-radius:14px;padding:34px 40px;text-align:center;max-width:620px}
  .locked .lk-icon{font-size:34px}
  .locked h2{font-family:var(--serif);font-size:24px;color:var(--navy);margin:10px 0 8px}
  .locked p{color:var(--muted);font-size:15px;margin-bottom:18px}
  .locked button.signin{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .locked button.signin:hover{background:var(--navy-deep)}
  .lock-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#a07d1a;background:#f6edd4;border:1px solid #e5d5a5;border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:middle}
  .preview-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#2E7D8A;background:#e6f2f4;border:1px solid #bfe0e5;border-radius:5px;padding:2px 7px;margin-left:8px;vertical-align:middle}
  .unlock-bar{background:#EAF1F8;border:1px solid #cdddf0;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .unlock-bar .ub-txt{flex:1;min-width:200px;font-size:14px;color:var(--navy-deep)}
  .unlock-bar button{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .unlock-bar button:hover{background:var(--navy-deep)}

  /* Snippet gate */
  .snippet-gate{position:relative;margin-top:8px}
  .sg-fade{height:70px;margin-top:-70px;background:linear-gradient(to bottom,rgba(255,255,255,0),var(--card));position:relative;pointer-events:none}
  .sg-box{background:#EAF1F8;border:1px solid #cdddf0;border-radius:14px;padding:26px 28px;text-align:center}
  .sg-lock{font-size:28px}
  .sg-title{font-family:var(--serif);font-size:22px;color:var(--navy);font-weight:600;margin:6px 0 8px}
  .sg-sub{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:520px;margin:0 auto 18px}
  .sg-box button{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .sg-box button:hover{background:var(--navy-deep)}
  table.md{border-collapse:collapse;width:100%;margin:16px 0;font-size:14px}
  table.md td,table.md th{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  table.md tr:nth-child(even){background:#faf8f4}

  .backbtn{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);cursor:pointer;margin-bottom:20px}
  .backbtn:hover{color:var(--teal)}
  .navbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .navbar button{display:inline-flex;align-items:center;gap:6px;background:#eef1f5;border:1px solid #dde3ea;color:var(--navy);border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .navbar button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navbar button.home{background:var(--navy);color:#fff;border-color:var(--navy)}
  .navbar button.home:hover{background:var(--navy-deep)}

  /* Sign-in */
  .signin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:34px 40px;max-width:520px}
  .signin h2{font-family:var(--serif);font-size:26px;color:var(--navy);margin-bottom:8px}
  .signin p.lead{color:var(--muted);font-size:15px;margin-bottom:20px}
  .signin label{display:block;font-size:13px;font-weight:600;color:var(--navy-deep);margin-bottom:6px}
  .si-row{display:flex;gap:8px;flex-wrap:wrap}
  .signin input{flex:1;min-width:180px;padding:12px 14px;border:1px solid #cdd5dd;border-radius:9px;font-size:16px;font-family:var(--sans);background:#fff}
  .signin input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,125,138,.12)}
  .signin button.primary{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap}
  .signin button.primary:hover{background:var(--navy-deep)}
  .si-msg{font-size:14px;margin-top:12px;min-height:18px;color:var(--muted)}
  .si-note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.55}
  .si-devices{font-size:12.5px;color:var(--steel);margin-top:10px}

  /* License badge in header */
  .lic-area{display:inline-flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}
  .lic-signin{background:var(--teal);color:#fff;border:none;padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .lic-signin:hover{background:#25626d}
  .lic-badge{display:inline-flex;align-items:center;gap:10px;color:#dce6f1;font-size:12.5px}
  .lic-badge b{color:#fff}
  .lic-out{color:#9fd0d9;text-decoration:underline;cursor:pointer;font-size:12.5px}

  .disclaimer{margin-top:34px;padding:16px 20px;background:#f0ede6;border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.5}

  /* Related sections */
  .related{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}
  .rel-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:12px}
  .rel-chips{display:flex;flex-wrap:wrap;gap:9px}
  .rel-chip{background:#eef1f5;border:1px solid #dde3ea;color:var(--navy);border-radius:20px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);text-align:left}
  .rel-chip:hover{background:var(--teal);color:#fff;border-color:var(--teal)}

  @media(max-width:860px){
    .layout{grid-template-columns:1fr}
    nav{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);display:none}
    nav.open{display:block}
    main{padding:24px 20px 70px}
    article{padding:26px 22px}
    .hero h1{font-size:30px}
    .menu-toggle{display:inline-flex!important}
  }
  .menu-toggle{display:none;align-items:center;gap:6px;background:#31547a;color:#fff;border:none;padding:9px 13px;border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans)}

  /* PWA install banner */
  #pwaInstall{display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:var(--teal);color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:14px/1.4 var(--sans);max-width:520px;margin:0 auto}
  #pwaInstall b{color:#fff}
  #pwaInstall .pwaHint{color:#d7eff2;margin-top:2px}
  #pwaInstall button.pwaBtn{background:#fff;color:var(--teal);border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
  #pwaInstall button.pwaX{position:absolute;top:6px;right:10px;background:transparent;border:0;color:#d7eff2;font-size:18px;cursor:pointer;line-height:1}
</style>

<body>
<div style="background:#16293f;display:flex;justify-content:center;gap:8px;padding:7px 10px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <span style="background:#2E7D8A;color:#fff;font-weight:700;font-size:13px;padding:7px 15px;border-radius:8px">📚 Peptide Library</span>
  <a href="/builder" style="background:rgba(255,255,255,.10);color:#cfe6e8;font-weight:700;font-size:13px;padding:7px 15px;border-radius:8px;text-decoration:none">🔒 Compliance-Ready Program</a>
</div>
<header>
  <div class="hwrap">
    <div class="brand">Peptides, Practiced<span class="dot">.</span><span class="ver" id="verTop">v2.0</span></div>

<script>
const DATA = window.LIBRARY_DATA || [];
const APP_VERSION = "2.0";  // email-license build; shown in header + footer

// ---------- License runtime (email sign-in) ----------
// Licensed state = a valid, unexpired token in localStorage. The server re-verifies
// the signature AND the 2-device registry on every /api/get-content call, so this
// client check is only a UI gate — it cannot grant access to paid content by itself.
function deviceId(){
  let d = null;
  try{ d = localStorage.getItem('pp_device'); }catch(e){}
  if(!d){
    try{
      d = Array.from(crypto.getRandomValues(new Uint8Array(9))).map(b=>('0'+b.toString(16)).slice(-2)).join('');
      localStorage.setItem('pp_device', d);
    }catch(e){ d = 'dev'+Math.random().toString(16).slice(2,12); }
  }
  return d;
}
const LIC = {
  token(){ try{ return localStorage.getItem('pp_lic_token')||''; }catch(e){ return ''; } },
  email(){ try{ return localStorage.getItem('pp_lic_email')||''; }catch(e){ return ''; } },
  device: deviceId,
  valid(){
    try{
      const t = this.token();
      if(!t || t.indexOf('.')<0) return false;
      const p = JSON.parse(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));
      return p && p.exp && (Date.now()/1000) < p.exp;
    }catch(e){ return false; }
  },
  save(tok,email){ try{ localStorage.setItem('pp_lic_token',tok); localStorage.setItem('pp_lic_email',email); }catch(e){} },
  clear(){
    try{
      localStorage.removeItem('pp_lic_token'); localStorage.removeItem('pp_lic_email');
      // drop cached locked-section bodies too
      for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k && k.indexOf('pp_sec_')===0) localStorage.removeItem(k); }
    }catch(e){}
  }
};
function isLicensed(){ return LIC.valid(); }

// ---------- Access control ----------
// Volume 01 (Mitochondrial) is the FREE preview — its full text ships in library-data.js.
const PREVIEW_CODES = ["01"];
// Snippet codes ship a public TEASER in library-data.js; the full body is server-side.
const SNIPPET_CODES = ["05","06","07","10","P03"];
function canView(code){ return isLicensed() || PREVIEW_CODES.includes(code); }
function isSnippet(code){ return !isLicensed() && SNIPPET_CODES.includes(code); }

// ---------- Related sections (clinician cross-references) ----------
const RELATED = {
  "01": ["P03","P04","P02","10","REF"],
  "02": ["04","P04","P03","LABS","REF"],
  "03": ["09","P05","P03","REF"],
  "04": ["02","P04","P03","REF"],
  "05": ["06","07","LABS","P02","REF"],
  "06": ["E01","05","LABS","P02","REF"],
  "07": ["05","P01","B01","REF"],
  "08": ["P01","01","P04","REF"],
  "09": ["03","P05","P03","REF"],
  "10": ["01","P02","REF"],
  "P01": ["08","07","01","REF"],
  "P02": ["01","10","05","06","REF"],
  "P03": ["01","02","09","04","REF"],
  "P04": ["02","04","01","LABS","REF"],
  "P05": ["09","03","P03","REF"],
  "B01": ["07","P01","REG","REF"],
  "E01": ["06","P02","REF"],
  "REF": ["LABS"],
  "LABS": ["05","06","02","REF"],
  "REG": ["B01","CITE"],
  "CITE": []
};
function relatedPanel(code){
  const rel = (RELATED[code]||[]).map(rc=>DATA.find(d=>d.code===rc)).filter(Boolean);
  if(!rel.length) return '';
  let chips = rel.map(d=>{
    const lockIcon = (!canView(d.code) && !isSnippet(d.code)) ? ' 🔒' : (isSnippet(d.code)?' ·preview':'');
    return '<button class="rel-chip" onclick="showDoc(\''+d.code+'\')">'+d.code+' — '+d.title+lockIcon+'</button>';
  }).join('');
  return '<div class="related"><div class="rel-title">Related sections</div><div class="rel-chips">'+chips+'</div></div>';
}

const GROUPS = [
  {kind:'vol', label:'Teaching Volumes'},
  {kind:'protocol', label:'Condition Protocols'},
  {kind:'special', label:'Special Chapters & Reference Tools'}
];

// ---------- Markdown-ish renderer ----------
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/(^|[^\*])\*([^\*]+?)\*(?!\*)/g,'$1<em>$2</em>');
  return s;
}
function renderMarkdown(text){
  const lines = text.split('\n');
  let html = '', i = 0, inList=false, listType='ul';
  function closeList(){ if(inList){ html += (listType==='ul'?'</ul>':'</ol>'); inList=false; } }
  while(i < lines.length){
    let ln = lines[i];
    let t = ln.trim();
    if(t.startsWith('|')){
      closeList();
      let rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){ rows.push(lines[i].trim()); i++; }
      rows = rows.filter(r=>!/^\|[\s\-\|:]+\|?$/.test(r));
      if(rows.length){
        const cells0 = rows[0].split('|').filter(c=>c.trim().length);
        if(rows.length===1 && cells0.length===1){
          const inner = inline(cells0[0].trim());
          if(cells0[0].includes('judgment call, not a default')){
            const full = cells0[0].trim();
            const teaser = "This is a judgment call, not a default. For most patients, 5 mg/day is the right starting dose — but in the unusually sensitive CIRS/mold patient you have the option to ease in below 5 mg.";
            const id = 'cbox'+(Math.random().toString(36).slice(2,8));
            html += '<div class="callout collapsible">'
              + '<div class="cb-teaser"><strong>Consideration — easing in for the unusually sensitive patient.</strong> '+teaser+'</div>'
              + '<div class="cb-full" id="'+id+'" style="display:none">'+inline(full)+'</div>'
              + '<button class="cb-toggle" onclick="(function(b){var f=document.getElementById(\''+id+'\');var open=f.style.display!==\'none\';f.style.display=open?\'none\':\'block\';b.textContent=open?\'Read the full reasoning ▾\':\'Show less ▴\';})(this)">Read the full reasoning ▾</button>'
              + '</div>';
          } else {
            html += '<div class="callout">'+inner+'</div>';
          }
        } else {
          html += '<table class="md">';
          rows.forEach((r,ri)=>{
            const cc = r.split('|');
            let cells2 = cc.slice(1, cc.length-1);
            if(cells2.length===0) cells2=[r.replace(/^\||\|$/g,'')];
            html += '<tr>'+cells2.map(c=>ri===0?'<th>'+inline(c.trim())+'</th>':'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';
          });
          html += '</table>';
        }
      }
      continue;
    }
    if(t===''){ closeList(); i++; continue; }
    if(t.startsWith('# ')){ closeList(); html+='<div class="doc-h1">'+inline(t.slice(2))+'</div>'; i++; continue; }
    if(t.startsWith('## ')){ closeList(); html+='<div class="doc-h2">'+inline(t.slice(3))+'</div>'; i++; continue; }
    if(t.startsWith('### ')){ closeList(); html+='<div class="doc-h3">'+inline(t.slice(4))+'</div>'; i++; continue; }
    if(/^\*\*[^*]+\*\*$/.test(t) && t.length<90){ closeList(); html+='<div class="doc-h2">'+inline(t)+'</div>'; i++; continue; }
    if(/^[-•]\s+/.test(t)){ if(!inList||listType!=='ul'){closeList();html+='<ul>';inList=true;listType='ul';} html+='<li>'+inline(t.replace(/^[-•]\s+/,''))+'</li>'; i++; continue; }
    if(/^\d+\.\s+/.test(t)){ if(!inList||listType!=='ol'){closeList();html+='<ol>';inList=true;listType='ol';} html+='<li>'+inline(t.replace(/^\d+\.\s+/,''))+'</li>'; i++; continue; }
    closeList();
    html += '<p>'+inline(t)+'</p>';
    i++;
  }
  closeList();
  return html;
}

function calcRun(){
  const mg = parseFloat(document.getElementById('c_mg').value);
  const bac = parseFloat(document.getElementById('c_bac').value);
  let dose = parseFloat(document.getElementById('c_dose').value);
  const unit = document.getElementById('c_unit').value;
  const out = document.getElementById('calc_out');
  if(!(mg>0)||!(bac>0)||!(dose>0)){ out.innerHTML=''; return; }
  const doseMg = unit==='mcg' ? dose/1000 : dose;
  const concMgMl = mg/bac;
  const volMl = doseMg/concMgMl;
  const units = volMl*100;
  const dosesPerVial = Math.floor(mg/doseMg);
  let warn = units>100;
  out.innerHTML =
    '<div class="calc-result'+(warn?' warn':'')+'">'
    + '<div class="big">'+ (Math.round(units*10)/10) +' <small>units</small></div>'
    + '<div class="detail">Draw to the <strong>'+(Math.round(units*10)/10)+'</strong> mark on a U-100 insulin syringe'
    + '<br>= '+(Math.round(volMl*1000)/1000)+' mL &nbsp;·&nbsp; concentration '+(Math.round(concMgMl*100)/100)+' mg/mL'
    + '<br>≈ '+dosesPerVial+' doses per vial at this dose'
    + (warn?'<br><strong>⚠ Over 100 units — this exceeds one U-100 syringe. Consider less water or split the dose.</strong>':'')
    + '</div></div>';
}

// ---------- Search ----------
function renderSearch(q){
  q = q.trim();
  if(q.length < 2){ renderHome(); return; }
  buildNav(null);
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const results = [];
  DATA.forEach(d=>{
    const low = (d.text||'').toLowerCase();
    let score = 0;
    terms.forEach(t=>{ const m = low.split(t).length-1; score += m; });
    if(d.title.toLowerCase().includes(q.toLowerCase())) score += 25;
    if(score>0){
      const idx = low.indexOf(terms[0]);
      let snip='';
      if(idx>=0 && low.length){
        const start=Math.max(0,idx-90), end=Math.min(d.text.length,idx+160);
        snip = (start>0?'…':'')+d.text.slice(start,end).replace(/\n/g,' ')+(end<d.text.length?'…':'');
        snip = esc(snip);
        terms.forEach(t=>{ const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); snip=snip.replace(re,'<mark>$1</mark>'); });
      }
      results.push({d,score,snip});
    }
  });
  results.sort((a,b)=>b.score-a.score);
  let html = '<div class="sr-head" style="font-size:14px;color:var(--muted);margin-bottom:16px">'+results.length+' result'+(results.length!==1?'s':'')+' for “'+esc(q)+'”</div>';
  if(!results.length){ html += '<p style="color:var(--muted)">No matches in the open preview. Sign in to search across the full library, or try a peptide name, condition, or clinical term.</p>'; }
  results.forEach(r=>{
    const locked = !canView(r.d.code) && !isSnippet(r.d.code);
    if(locked){
      html += '<div class="sr" style="background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 20px;margin-bottom:12px;cursor:pointer" onclick="showDoc(\''+r.d.code+'\')"><div style="font-size:11.5px;font-weight:700;color:var(--teal);text-transform:uppercase">'+r.d.code+' · '+({vol:'Teaching Volume',protocol:'Protocol',special:'Reference'}[r.d.kind])+' · 🔒 locked</div>'
        + '<div style="font-family:var(--serif);font-size:17px;color:var(--navy);margin:3px 0 5px">'+r.d.title+'</div>'
        + '<div style="font-size:14px;color:#9aa4ae">Sign in to read this section.</div></div>';
    } else {
      html += '<div class="sr" style="background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 20px;margin-bottom:12px;cursor:pointer" onclick="showDoc(\''+r.d.code+'\')"><div style="font-size:11.5px;font-weight:700;color:var(--teal);text-transform:uppercase">'+r.d.code+' · '+({vol:'Teaching Volume',protocol:'Protocol',special:'Reference'}[r.d.kind])+'</div>'
        + '<div style="font-family:var(--serif);font-size:17px;color:var(--navy);margin:3px 0 5px">'+r.d.title+'</div>'
        + (r.snip?'<div style="font-size:14px;color:#4c5661;line-height:1.55">'+r.snip+'</div>':'')+'</div>';
    }
  });
  document.getElementById('main').innerHTML = html;
  window.scrollTo(0,0);
}

let searchTimer;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  const v=e.target.value;
  searchTimer=setTimeout(()=>{
    if(v.trim().length<2){ renderHome(); return; }
    renderSearch(v);
  },200);
});
document.getElementById('search').addEventListener('change',e=>{
  const v=e.target.value.trim();
  if(v.length>=2){ history.replaceState({view:'search',q:v},'', '#search'); }
});

// ---------- Init ----------
// Ask the browser to keep our storage (stops Android from silently evicting the
// license token / cached sections, which would otherwise log the user out).
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}
deviceId(); // ensure a stable device id exists before first sign-in
history.replaceState({view:'home',base:true},'', '#home');
syncLicArea();
renderHome();

// Register service worker (installable app + offline reading)
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>

<!-- ===== Add-to-Home-Screen helper (mobile) ===== -->
<div id="pwaInstall">
  <button class="pwaX" onclick="document.getElementById('pwaInstall').style.display='none'" aria-label="Dismiss">×</button>
  <div style="display:flex;gap:12px;align-items:center">
    <img src="icon-192.png" alt="" style="width:44px;height:44px;border-radius:10px;flex:0 0 auto">
    <div style="flex:1">
      <b>Add this library to your phone</b>
      <div class="pwaHint" id="pwaHint"></div>
    </div>
    <button class="pwaBtn" id="pwaBtn" style="display:none">Install</button>
  </div>
</div>
<script>
(function(){
  var box=document.getElementById('pwaInstall'), btn=document.getElementById('pwaBtn'), hint=document.getElementById('pwaHint');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
  if(standalone) return;
  var isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e;
    hint.textContent='Install it like an app — one tap, opens full-screen.';
    btn.style.display='inline-block'; box.style.display='block';
  });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt(); deferred.userChoice.then(function(){ box.style.display='none'; deferred=null; });
  });
  window.addEventListener('appinstalled',function(){ box.style.display='none'; });
  if(isiOS){
    hint.innerHTML='Tap the <b>Share</b> icon, then <b>“Add to Home Screen.”</b>';
    box.style.display='block';
  } else if(isMobile){
    setTimeout(function(){
      if(box.style.display!=='block'){
        hint.innerHTML='Open your browser menu (⋮) and tap <b>“Add to Home screen”</b> / <b>“Install app.”</b>';
        box.style.display='block';
      }
    }, 1800);
  }
})();
</script>
